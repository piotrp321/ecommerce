# Continuous integration. It reuses the project's Makefile and Compose files,
# so CI runs exactly what developers run locally (see AGENTS.md).
name: CI

# Pull requests to main and pushes to main run the quality gates. The production
# image check is temporarily manual only: run this workflow from the Actions tab
# or with `gh workflow run ci.yml --ref <branch>` (it then runs that job alone).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: the workflow only needs to check out the code.
permissions:
  contents: read

# A newer run of the same event on the same PR or branch cancels the one in
# progress. The event name keeps a manual production check and the automatic
# quality gates on main in separate groups, so neither cancels the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (make check)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Bootstrap (with Keycloak), make check and the second, dev-check stack of
    # make stack-check-dev: about 10 minutes, so 30 leaves room for a cold cache.
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exactly the fresh-clone setup documented in README: build the dev images,
      # install the pnpm workspace into its volumes, start PostgreSQL (with the Keycloak
      # database), the backend, the admin/store dev servers, Keycloak and the Redis
      # session store, install Composer dependencies, run migrations.
      - name: Bootstrap the development environment
        run: make bootstrap

      # Backend: composer validate, lint:container, lint:yaml, Deptrac, PHPStan
      # (level max) and PHPUnit (test database prepared by make backend-db-test).
      # Admin and store: ESLint, TypeScript type check, Vitest and the production build.
      - name: Run all quality gates
        run: make check

      # Keycloak (realms, clients, PKCE, logins with the dev seed users), Redis (ACL,
      # noeviction, persistence), port exposure and the apps without Keycloak/Redis,
      # in a separate Compose project (ecommerce-dev-check) next to the one above.
      - name: Check the development infrastructure
        run: make stack-check-dev

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the containers
        if: always()
        run: make down

  # Manual only for now (workflow_dispatch). Recommended before merging changes that
  # affect the production images: infra/, compose*.yaml, the Makefile, a Dockerfile
  # or dependency manifests and lockfiles.
  production-image:
    name: Production image (make check-prod)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the prod images without secrets and checks them: the admin and store
      # images on their own (read-only, all capabilities dropped), then the whole
      # topology (edge, backend, store, admin, PostgreSQL) in an ephemeral project
      # with one-time generated secrets (never real production values): routing,
      # exposure, privileges, backend behaviour and independent redeployment.
      - name: Build and check the production images and topology
        run: make check-prod
