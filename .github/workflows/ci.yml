# Continuous integration. It reuses the project's Makefile and Compose files,
# so CI runs exactly what developers run locally (see AGENTS.md).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: the workflow only needs to check out the code.
permissions:
  contents: read

# A newer push to the same PR or branch cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (make check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exactly the fresh-clone setup documented in README: build the dev images,
      # install the pnpm workspace into its volumes, start PostgreSQL, the backend
      # and the admin/store dev servers, install Composer dependencies, run migrations.
      - name: Bootstrap the development environment
        run: make bootstrap

      # Backend: composer validate, lint:container, lint:yaml, Deptrac, PHPStan
      # (level max) and PHPUnit (test database prepared by make backend-db-test).
      # Admin and store: ESLint, TypeScript type check, Vitest and the production build.
      - name: Run all quality gates
        run: make check

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the containers
        if: always()
        run: make down

  production-image:
    name: Production image (make check-prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the prod images without secrets and checks them: the admin and store
      # images on their own (read-only, all capabilities dropped), then the whole
      # topology (edge, backend, store, admin, PostgreSQL) in an ephemeral project
      # with one-time generated secrets (never real production values): routing,
      # exposure, privileges, backend behaviour and independent redeployment.
      - name: Build and check the production images and topology
        run: make check-prod
