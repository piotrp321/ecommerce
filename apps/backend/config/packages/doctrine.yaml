doctrine:
    dbal:
        # Separate parameters instead of a DSN: no URL encoding of the password needed.
        driver: pdo_pgsql
        host: '%env(DATABASE_HOST)%'
        port: '%env(int:DATABASE_PORT)%'
        dbname: '%env(DATABASE_NAME)%'
        user: '%env(DATABASE_USER)%'
        password: '%env(DATABASE_PASSWORD)%'
        server_version: '%env(DATABASE_SERVER_VERSION)%'
        charset: utf8

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # Mappings are registered per bounded context: XML files in the module's
        # Infrastructure layer, so the domain classes stay free of ORM metadata.
        mappings:
            Catalog:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Catalog\Domain'
                alias: Catalog
            Inventory:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inventory/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Inventory\Domain'
                alias: Inventory
            Customers:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Customers/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Customers\Domain'
                alias: Customers
            Backoffice:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Backoffice/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Backoffice\Domain'
                alias: Backoffice

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
