packages:
  - apps/*
  - packages/*

# Fail fast on a Node.js version other than the one pinned in package.json/.node-version.
engineStrict: true

# Exact versions in package.json when adding dependencies (pnpm add).
saveExact: true

# openid-client depends on jose ^6; the store pins the same exact version for its own use
# (back-channel logout tokens), so both resolve to one copy.
overrides:
  jose: 6.2.12
