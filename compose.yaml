# Shared configuration, always combined with an environment file:
# - development: compose.override.yaml (loaded automatically by `docker compose`),
# - production:  docker compose -f compose.yaml -f compose.prod.yaml ...
# The database credentials below are development defaults only; compose.prod.yaml
# replaces them with values that must be provided at runtime.
# Ports are published by the environment files only (Compose merges port lists,
# so a port published here could not be restricted to localhost in development).

# Development project name. compose.prod.yaml sets its own name, so the two
# environments never share containers, networks or volumes.
name: ecommerce

services:
  backend:
    build:
      # Repository root as context, restricted by infra/docker/backend/Dockerfile.dockerignore.
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, backend:80
      DATABASE_NAME: ${POSTGRES_DB:-app}
      DATABASE_USER: ${POSTGRES_USER:-app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      DATABASE_SERVER_VERSION: ${POSTGRES_VERSION:-18.6}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      database:
        condition: service_healthy

  admin:
    build:
      # Repository root as context, restricted by infra/docker/admin/Dockerfile.dockerignore.
      context: .
      dockerfile: infra/docker/admin/Dockerfile
    restart: unless-stopped

  store:
    build:
      # Repository root as context, restricted by infra/docker/store/Dockerfile.dockerignore.
      context: .
      dockerfile: infra/docker/store/Dockerfile
    restart: unless-stopped

  database:
    image: postgres:${POSTGRES_VERSION:-18.6}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker
      - database_data:/var/lib/postgresql

  # Store sessions (Redis), in development (compose.override.yaml) and production
  # (compose.prod.yaml), which provide the passwords. ACL: the default user is disabled;
  # "store" may use only keys store:* and the commands the store session store needs,
  # directly and inside its Lua scripts (EVAL: DEL, EXISTS, GET, HGET, HINCRBY, HSET,
  # PEXPIRE), MULTI/EXEC and the node-redis handshake HELLO/AUTH/CLIENT SETINFO;
  # "ops" administers (health check, CONFIG). The ACL file is generated at startup from
  # the environment (no password in the repository, on the command line or in the image)
  # in /tmp, so the same command runs as root (development) and as the unprivileged
  # redis user (production). Passwords must not contain whitespace.
  # No service depends on it (depends_on).
  redis-session:
    image: redis:8.8.2-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-ec"]
    command:
      - |
        umask 077
        {
          echo "user default reset off"
          echo "user store reset on >$${REDIS_SESSION_PASSWORD} ~store:* resetchannels -@all +auth +hello +client|setinfo +ping +eval +evalsha +multi +exec +get +getdel +set +del +exists +hget +hset +hgetall +hincrby +pexpire +sadd +smembers +srem"
          echo "user ops reset on >$${REDIS_OPS_PASSWORD} ~* &* +@all"
        } > /tmp/users.acl
        chown redis:redis /tmp/users.acl
        exec docker-entrypoint.sh redis-server --aclfile /tmp/users.acl \
          --appendonly yes --appendfsync everysec --save "" \
          --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_OPS_PASSWORD\" redis-cli --no-auth-warning --user ops ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 384m
    volumes:
      - redis_session_data:/data

  # Optional services, prepared for later stages and not used by any application yet.
  # They belong to profiles, so `docker compose up` and `make up` do not start them;
  # `make rabbitmq-up` / `make elasticsearch-up` do. No service depends on them
  # (depends_on). Credentials come from compose.override.yaml (development) and
  # compose.prod.yaml (production), where the passwords come from the environment only;
  # the containers refuse to start without them, and only when their profile is active.

  # Message broker (profile "messaging"). The node name derives from the hostname and
  # the data directory from the node name, so the hostname must stay fixed.
  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    profiles: [messaging]
    hostname: rabbitmq
    restart: unless-stopped
    # Refuses to start without credentials: without them the image would create the
    # well-known default user guest/guest.
    entrypoint:
      - sh
      - -ec
      - |
        : "$${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}"
        : "$${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}"
        exec docker-entrypoint.sh "$$@"
      - rabbitmq
    command: [rabbitmq-server]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    mem_limit: 512m
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Search engine (profile "search"), single node, security enabled (user "elastic"),
  # plain HTTP because it is reachable only inside the Compose network and on 127.0.0.1
  # in development.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    profiles: [search]
    restart: unless-stopped
    # Refuses to start without the password of the "elastic" user (without it the
    # secured cluster would have no usable superuser).
    entrypoint:
      - sh
      - -ec
      - |
        : "$${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set}"
        exec /bin/tini -- /usr/local/bin/docker-entrypoint.sh "$$@"
      - elasticsearch
    command: [eswrapper]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s --max-time 5 -u "elastic:$$ELASTIC_PASSWORD" http://localhost:9200/_cluster/health | grep -Eq '"status":"(green|yellow)"'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    mem_limit: 1g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  caddy_data:
  caddy_config:
  database_data:
  redis_session_data:
  rabbitmq_data:
  elasticsearch_data:
