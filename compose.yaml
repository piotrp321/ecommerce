# Shared configuration, always combined with an environment file:
# - development: compose.override.yaml (loaded automatically by `docker compose`),
# - production:  docker compose -f compose.yaml -f compose.prod.yaml ...
# The database credentials below are development defaults only; compose.prod.yaml
# replaces them with values that must be provided at runtime.
# Ports are published by the environment files only (Compose merges port lists,
# so a port published here could not be restricted to localhost in development).

# Development project name. compose.prod.yaml sets its own name, so the two
# environments never share containers, networks or volumes.
name: ecommerce

services:
  backend:
    build:
      # Repository root as context, restricted by infra/docker/backend/Dockerfile.dockerignore.
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, backend:80
      DATABASE_NAME: ${POSTGRES_DB:-app}
      DATABASE_USER: ${POSTGRES_USER:-app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      DATABASE_SERVER_VERSION: ${POSTGRES_VERSION:-18.6}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      database:
        condition: service_healthy

  admin:
    build:
      # Repository root as context, restricted by infra/docker/admin/Dockerfile.dockerignore.
      context: .
      dockerfile: infra/docker/admin/Dockerfile
    restart: unless-stopped

  store:
    build:
      # Repository root as context, restricted by infra/docker/store/Dockerfile.dockerignore.
      context: .
      dockerfile: infra/docker/store/Dockerfile
    restart: unless-stopped

  database:
    image: postgres:${POSTGRES_VERSION:-18.6}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker
      - database_data:/var/lib/postgresql

  # Store sessions (Redis), in development (compose.override.yaml) and production
  # (compose.prod.yaml), which provide the passwords. ACL: the default user is disabled;
  # "store" may use only keys store:* and the commands the store session store needs,
  # directly and inside its Lua scripts (EVAL: DEL, EXISTS, GET, HGET, HINCRBY, HSET,
  # PEXPIRE), MULTI/EXEC and the node-redis handshake HELLO/AUTH/CLIENT SETINFO;
  # "ops" administers (health check, CONFIG). The ACL file is generated at startup from
  # the environment (no password in the repository, on the command line or in the image)
  # in /tmp, so the same command runs as root (development) and as the unprivileged
  # redis user (production). Passwords must not contain whitespace.
  # No service depends on it (depends_on).
  redis-session:
    image: redis:8.8.2-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-ec"]
    command:
      - |
        umask 077
        {
          echo "user default reset off"
          echo "user store reset on >$${REDIS_SESSION_PASSWORD} ~store:* resetchannels -@all +auth +hello +client|setinfo +ping +eval +evalsha +multi +exec +get +getdel +set +del +exists +hget +hset +hgetall +hincrby +expire +pexpire +sadd +smembers +srem"
          echo "user ops reset on >$${REDIS_OPS_PASSWORD} ~* &* +@all"
        } > /tmp/users.acl
        chown redis:redis /tmp/users.acl
        exec docker-entrypoint.sh redis-server --aclfile /tmp/users.acl \
          --appendonly yes --appendfsync everysec --save "" \
          --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_OPS_PASSWORD\" redis-cli --no-auth-warning --user ops ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 384m
    volumes:
      - redis_session_data:/data

volumes:
  caddy_data:
  caddy_config:
  database_data:
  redis_session_data:
