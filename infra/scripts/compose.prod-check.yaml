# Ephemeral production check, used by `make check-prod` (infra/scripts/check-prod-stack.sh):
# docker compose -f compose.yaml -f compose.prod.yaml -f infra/scripts/compose.prod-check.yaml ...
# Its own project, alternative ports and tmpfs storage: it can run next to the dev
# project and leaves no persistent volumes behind, so cleaning up never deletes data.

name: ecommerce-prod-check

services:
  edge:
    volumes: !reset []
    tmpfs:
      - /data:uid=1000,gid=1000
      - /config:uid=1000,gid=1000

  backend:
    volumes: !reset []

  store:
    environment:
      # The check proves the API mode (ADR-0009): never inherit STORE_BACKEND_URL from
      # .env or the shell (an empty value there selects the demo data).
      STORE_BACKEND_URL: http://backend:80

  database:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql
