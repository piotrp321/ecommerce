# Production: docker compose -f compose.yaml -f compose.prod.yaml up --wait
# Topology: the edge proxy (Caddy) is the only public entry point; it terminates TLS
# and routes by domain and path to the backend, the store and the admin. Backend,
# store, admin and PostgreSQL are reachable only inside the Compose network.
# Each application is a separate image and can be built and redeployed on its own
# (docker compose ... up -d --no-deps <service>); the edge does not need a restart.
#
# Secrets and domains are provided at runtime through the environment, never stored
# in the images or in the repository. Compose refuses to start when a required value
# is missing, and the backend entrypoint validates its secrets again.
# Ports use PROD_* variables (default 80/443). On a host that also runs the dev
# project (127.0.0.1:80/443), choose other ports, e.g. PROD_HTTPS_PORT=8443.

# Separate Compose project: its own containers, network and volumes
# (ecommerce-prod_*), never shared with the development project "ecommerce".
name: ecommerce-prod

services:
  edge:
    image: ${IMAGES_PREFIX:-}ecommerce-edge
    build:
      # Repository root as context, restricted by infra/edge/Dockerfile.dockerignore.
      context: .
      dockerfile: infra/edge/Dockerfile
      target: edge_prod
    restart: unless-stopped
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN:?STORE_DOMAIN must be set (e.g. shop.example.com)}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN must be set (e.g. admin.example.com)}
      # Extra Caddy global options, e.g. "email ops@example.com" for ACME.
      CADDY_GLOBAL_OPTIONS: ${EDGE_GLOBAL_OPTIONS:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - edge_data:/data
      - edge_config:/config
    ports:
      - target: 8080
        published: ${PROD_HTTP_PORT:-80}
        protocol: tcp
      - target: 8443
        published: ${PROD_HTTPS_PORT:-443}
        protocol: tcp
      - target: 8443
        published: ${PROD_HTTP3_PORT:-443}
        protocol: udp

  backend:
    image: ${IMAGES_PREFIX:-}ecommerce-backend
    build:
      target: frankenphp_prod
    environment:
      # Plain HTTP inside the network; TLS terminates at the edge.
      SERVER_NAME: ":80"
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set (at least 32 characters)}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

  admin:
    image: ${IMAGES_PREFIX:-}ecommerce-admin
    build:
      target: admin_prod
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  store:
    image: ${IMAGES_PREFIX:-}ecommerce-store
    build:
      target: store_prod
    environment:
      # Server to server inside the network, without the edge and the /api prefix (ADR-0009).
      # Unset: the API; STORE_BACKEND_URL= (empty) selects the demo data. No depends_on:
      # the store is deployed independently and shows an error page while the backend is down.
      STORE_BACKEND_URL: ${STORE_BACKEND_URL-http://backend:80}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /app/apps/store/.next/cache:uid=1000,gid=1000

  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

volumes:
  edge_data:
  edge_config:
