# Development only (loaded automatically by `docker compose`).
# Simplifications compared to the production image:
# - apps/backend is bind-mounted into /app (code, vendor/ and var/),
# - dependencies are installed explicitly with `make backend-install`,
# - the database port is published on the host,
# - admin runs the Vite dev server (HMR) on the bind-mounted repository; its
#   node_modules live in Docker volumes (Linux binaries), separate from a macOS
#   host install, and are installed explicitly with `make pnpm-install`.
# All ports are bound to 127.0.0.1 only, so they are not reachable from the network.
# The admin service exists only in development for now; its production
# deployment comes with the central edge proxy (stage 4).

services:
  backend:
    image: ${IMAGES_PREFIX:-}ecommerce-backend-dev
    build:
      target: frankenphp_dev
    environment:
      APP_ENV: dev
    volumes:
      - ./apps/backend:/app
      - ./infra/docker/backend/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./infra/docker/backend/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    ports:
      - target: 80
        host_ip: 127.0.0.1
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - target: 443
        host_ip: 127.0.0.1
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - target: 443
        host_ip: 127.0.0.1
        published: ${HTTP3_PORT:-443}
        protocol: udp
    tty: true

  database:
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        published: ${POSTGRES_PORT:-5432}
        protocol: tcp

  admin:
    image: ${IMAGES_PREFIX:-}ecommerce-admin-dev
    build:
      # Repository root as context, restricted by infra/docker/admin/Dockerfile.dockerignore.
      context: .
      dockerfile: infra/docker/admin/Dockerfile
      target: admin_dev
    restart: unless-stopped
    environment:
      # /api on the dev server is proxied to the backend inside the Compose network.
      ADMIN_API_PROXY_TARGET: http://backend:80
      ADMIN_DEV_POLLING: ${ADMIN_DEV_POLLING:-0}
    volumes:
      - ./:/workspace
      # Mask the host node_modules: the container uses its own (Linux) dependencies.
      - node_modules:/workspace/node_modules
      - admin_node_modules:/workspace/apps/admin/node_modules
    ports:
      - target: 5173
        host_ip: 127.0.0.1
        published: ${ADMIN_PORT:-5173}
        protocol: tcp

volumes:
  node_modules:
  admin_node_modules:
